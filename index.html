<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convite de Formatura – Alexia Mirele</title>
<meta property="og:title" content="Convite de Formatura – Alexia Mirele">
<meta property="og:description" content="Você foi convidado(a)! Toque para abrir o convite.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@1,600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1633; --navy2:#13224d; --royal:#1f3fa8; --gold:#c9a24a; --gold2:#f1d78a;
    --paper:#fbf6ea; --ink:#2a2a2a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#060b1c}
  html,body{min-height:100%}
  body{
    font-family:'Cormorant Garamond',serif; color:var(--ink);
    background:radial-gradient(ellipse at top,#1c2b5c 0%,var(--navy) 55%,#060b1c 100%) fixed;
    overflow-x:hidden;
  }
  /* estrelinhas douradas */
  .sparkles{position:fixed;inset:0;pointer-events:none;z-index:0}
  .sparkles i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold2);opacity:.0;animation:tw 4s infinite}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1.2)}}

  /* ===== TELA DO ENVELOPE ===== */
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;transition:opacity 1s ease, visibility 1s}
  #intro.gone{opacity:0;visibility:hidden}
  .hint{font-family:'Montserrat',sans-serif;color:var(--gold2);letter-spacing:.25em;font-size:.72rem;text-transform:uppercase;margin-top:42px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  .to{font-family:'Great Vibes',cursive;color:var(--gold2);font-size:2.2rem;margin-bottom:28px;text-shadow:0 2px 12px rgba(0,0,0,.5)}

  .envelope{position:relative;width:min(88vw,380px);aspect-ratio:1.45;perspective:1200px;cursor:pointer}
  .env-back{position:absolute;inset:0;background:linear-gradient(160deg,#efe4c8,#dccca4);border-radius:6px;box-shadow:0 25px 60px rgba(0,0,0,.6)}
  .letter{position:absolute;left:6%;right:6%;top:8%;bottom:6%;background:var(--paper);border-radius:4px;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .7s;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .letter .mini{font-family:'Great Vibes',cursive;color:var(--royal);font-size:1.8rem}
  .letter .mini2{font-family:'Montserrat',sans-serif;font-size:.6rem;letter-spacing:.3em;color:var(--gold);margin-top:6px}
  .env-front{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:6px;overflow:hidden}
  .env-front:before,.env-front:after{content:"";position:absolute;inset:0}
  .env-front:before{clip-path:polygon(0 0,52% 58%,0 100%);background:linear-gradient(90deg,#e4d5ae,#ece0c0)}
  .env-front:after{clip-path:polygon(100% 0,48% 58%,100% 100%);background:linear-gradient(270deg,#e0d0a8,#eadcbb)}
  .env-bottom{position:absolute;left:0;right:0;bottom:0;height:55%;z-index:4;
    clip-path:polygon(0 100%,50% 8%,100% 100%);background:linear-gradient(0deg,#e8dab6,#f0e5c9)}
  .flap{position:absolute;left:0;right:0;top:0;height:60%;z-index:6;transform-origin:top center;
    transition:transform .8s ease, z-index 0s .4s;}
  .flap:before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);
    background:linear-gradient(180deg,#f3e9cf,#dfcfa8);filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
  .seal{position:absolute;left:50%;top:60%;width:86px;height:86px;transform:translate(-50%,-50%);z-index:8;
    transition:transform .6s ease, opacity .6s ease}
  .seal svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
  .envelope:hover .seal{transform:translate(-50%,-50%) scale(1.06)}

  .envelope.open .seal{transform:translate(-50%,-50%) scale(1.4) rotate(-12deg);opacity:0}
  .envelope.open .flap{transform:rotateX(180deg);z-index:1}
  .envelope.open .letter{transform:translateY(-62%)}

  /* ===== CONVITE ===== */
  #invite{position:relative;z-index:2;opacity:0;transform:translateY(30px);transition:opacity 1.2s ease, transform 1.2s ease;
    max-width:560px;margin:0 auto;padding:28px 18px 60px;display:none}
  #invite.show{opacity:1;transform:none}

  .actions{display:flex;gap:12px;margin-bottom:22px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
    font-family:'Montserrat',sans-serif;font-weight:600;font-size:.82rem;letter-spacing:.04em;
    padding:14px 10px;border-radius:14px;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .2s}
  .btn:active{transform:scale(.97)}
  .btn svg{width:22px;height:22px;flex:none}
  .btn.map{background:linear-gradient(135deg,#ffffff,#eef1f8);color:#1a2a5a;border:1.5px solid var(--gold)}
  .btn.wa{background:linear-gradient(135deg,#25d366,#128c4a)}
  .btn small{display:block;font-weight:400;font-size:.66rem;opacity:.85;letter-spacing:0}

  .card{background:var(--paper);border-radius:10px;padding:44px 30px 40px;text-align:center;position:relative;
    box-shadow:0 30px 70px rgba(0,0,0,.55)}
  .card:before{content:"";position:absolute;inset:10px;border:1.5px solid var(--gold);border-radius:6px;pointer-events:none}
  .card:after{content:"";position:absolute;inset:15px;border:.5px solid rgba(201,162,74,.6);border-radius:4px;pointer-events:none}
  .cap{width:64px;margin:0 auto 6px;display:block}
  .over{font-family:'Montserrat',sans-serif;letter-spacing:.35em;font-size:.68rem;color:var(--gold);text-transform:uppercase}
  .name{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;color:var(--royal);font-size:clamp(2.2rem,10vw,3rem);line-height:1.1;margin:16px 0 8px;letter-spacing:.01em}
  .course{font-size:1.15rem;font-style:italic;color:#555}
  .divider{display:flex;align-items:center;gap:10px;justify-content:center;margin:22px 0;color:var(--gold)}
  .divider span{height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .text{font-size:1.18rem;line-height:1.6;color:#3a3a3a}
  .details{display:flex;justify-content:center;align-items:stretch;margin:26px 0 8px;font-family:'Montserrat',sans-serif}
  .details>div{padding:0 16px}
  .details>div+div{border-left:1px solid var(--gold)}
  .details .k{font-size:.6rem;letter-spacing:.25em;color:var(--gold);text-transform:uppercase}
  .details .v{font-size:1rem;font-weight:600;color:var(--navy2);margin-top:4px}
  .place{margin-top:16px;font-size:1.1rem}
  .place b{display:block;color:var(--navy2);font-weight:600;font-size:1.2rem}
  .quote{margin-top:24px;font-style:italic;color:#666;font-size:1.05rem}
  .rsvp-note{margin-top:14px;font-family:'Montserrat',sans-serif;font-size:.7rem;color:#777;letter-spacing:.03em}

  .photo{margin-top:26px;border-radius:10px;overflow:hidden;position:relative;box-shadow:0 30px 70px rgba(0,0,0,.6);border:3px solid var(--gold)}
  .photo img{display:block;width:100%;height:auto}
  .photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 16px;text-align:center;
    background:linear-gradient(0deg,rgba(6,11,28,.85),transparent);color:var(--gold2);font-family:'Great Vibes',cursive;font-size:2rem}
  .foot{text-align:center;color:var(--gold2);opacity:.7;font-family:'Montserrat',sans-serif;font-size:.65rem;letter-spacing:.3em;margin-top:26px;text-transform:uppercase}
</style>
</head>

  sp.appendChild(s);

// abrir envelope
const env = $('envelope');
let opened = false;
function abrir(){
  if (opened) return; opened = true;
  env.classList.add('open');
  setTimeout(() => {
    $('intro').classList.add('gone');
    const inv = $('invite');
    inv.style.display = 'block';
    requestAnimationFrame(() => requestAnimationFrame(() => inv.classList.add('show')));
    window.scrollTo(0,0);
  }, 2100);
}
env.addEventListener('click', abrir);
env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') abrir(); });
